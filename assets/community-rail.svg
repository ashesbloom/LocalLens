<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 32" width="500" height="32" role="img">
  <style>
    .bg   { fill: #04070B; stroke: #35F08A; opacity: 0.92 }
    .dim  { fill: #1E9C5C }
    .name { fill: #35F08A }
    .mark { fill: #35F08A }
    .arw  { stroke: #35F08A }
    @media (prefers-color-scheme: light) {
      .bg   { fill: #FFFFFF; stroke: #1E9C5C; opacity: 1 }
      .dim  { fill: #1E9C5C }
      .name { fill: #0F5C33 }
      .mark { fill: #0F5C33 }
      .arw  { stroke: #0F5C33 }
    }
    @keyframes ll-blink { 0%, 45% { opacity: 1 } 55%, 100% { opacity: 0 } }
    .caret { animation: ll-blink 1.15s steps(1, end) infinite }
    @media (prefers-reduced-motion: reduce) { .caret { animation: none } }
  </style>
  <rect class="bg" x="0.7" y="0.7" width="498.6" height="24.6" rx="7"
