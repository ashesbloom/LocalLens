  <rect class="caret mark" x="14" y="7.6" width="7" height="10.8" fill="#35F08A"/>
  <text x="28" y="17.6" font-family="monospace" font-size="13">
    <tspan class="dim" fill="#1E9C5C">locallens@community:~$ </tspan><tspan class="name" fill="#35F08A" font-weight="700">LocalLens community website</tspan>
  </text>
  <g class="arw" stroke="#35F08A" stroke-width="1.6" stroke-linecap="round" fill="none">
    <path d="M468 19 L478 9"/><path d="M478 9 L471.5 9"/><path d="M478 9 L478 15.5"/>
