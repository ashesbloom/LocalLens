name: Vision Core test app

# Builds the LocalLens Vision Core test app (backend/vision_core/bench.py) for the machines that close gate G6:
# Windows x64, Intel Mac and Apple Silicon. Run by hand only; it publishes nothing, the apps are workflow artifacts.
# Testers put the int8 `models` folder next to the app (not bundled: 1.2 GB) and send back the JSON report.
# A push to a bench/* branch builds it without touching main (workflow_dispatch needs the file on the default branch).
on:
  workflow_dispatch:
  push:
    branches: ['bench/**']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-13 retired 2025-12-04; macos-15-intel is the Intel image. onnxruntime ships no Intel-Mac wheel after
        # 1.23.2; the int8 models give identical vectors on 1.23.2 and 1.31.0 (checked 2026-11-09).
        include:
          - os: windows-latest
            ort: '1.31.0'
          - os: macos-15-intel
            ort: '1.23.2'
          - os: macos-15
            ort: '1.31.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install the test app's packages (versions the lab measured with)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pillow==12.2.0 pillow-heif==1.3.0 onnxruntime==${{ matrix.ort }} tokenizers==0.23.3 pyinstaller==6.19.0

      - name: Tests
        shell: bash   # PowerShell would carry on after a failing first test
        working-directory: backend
        run: |
          set -e
          python -m vision_core.test_speed
          python -m vision_core.test_bench

      - name: Build
        working-directory: backend
        run: python -m PyInstaller vision_bench.spec --noconfirm

      # The built app must start on each machine (D111): the Intel Mac build had never been run. A tiny model made here
      # (onnx is a CI-only tool, not in the app) stands in for the 1.2 GB models; no photos are used.
      - name: Self-check the built app
        shell: bash
        working-directory: backend
        run: |
          set -e
          pip install onnx==1.17.0
          python - <<'PY'
          import onnx
          from onnx import TensorProto, helper
          x = helper.make_tensor_value_info("x", TensorProto.FLOAT, [1, 4])
          y = helper.make_tensor_value_info("y", TensorProto.FLOAT, [1, 2])
          w = helper.make_tensor("w", TensorProto.FLOAT, [4, 2], [0.5] * 8)
          g = helper.make_graph([helper.make_node("MatMul", ["x", "w"], ["y"])], "tiny", [x], [y], [w])
          m = helper.make_model(g, opset_imports=[helper.make_opsetid("", 13)])
          m.ir_version = 8
          onnx.save(m, "tiny.onnx")
          PY
          if [ "$RUNNER_OS" = "Windows" ]; then app=dist/LocalLensBench/LocalLensBench.exe; else app=dist/LocalLensBench/LocalLensBench; fi
          "$app" --selfcheck tiny.onnx

      # One zip per platform made on the runner: an artifact upload drops Unix permissions, and the Mac app must
      # stay executable for testers.
      - name: Package
        shell: bash
        working-directory: backend/dist
        run: |
          out="../../LocalLensBench-$RUNNER_OS-$RUNNER_ARCH.zip"
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip "$out" LocalLensBench > /dev/null; else ditto -c -k --keepParent LocalLensBench "$out"; fi
          ls -la "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: LocalLensBench-${{ runner.os }}-${{ runner.arch }}
          path: LocalLensBench-*.zip
          retention-days: 30
